# Flatpak manifest (hand-off, NOT built or tested by the author).
#
# It repackages the prebuilt Linux tarball from a GitHub release, which is the usual approach for Tauri apps. The tarball holds the
# program, the bundled engines, the license, the desktop entry, the metadata and the icons, so nothing else is needed.
# In the release's hand-off bundle the version and checksum below are already filled in; in the repository they are placeholders.
#
#   flatpak-builder --user --install --force-clean build-dir io.github.thestylewithin.DesktopCollegeDorms.yml
#
# Anyone is welcome to submit this to Flathub (see packaging/README.md and the MIT license).
app-id: io.github.thestylewithin.DesktopCollegeDorms
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: desktop-college-dorms

finish-args:
  - --share=ipc
  - --share=network                       # model downloads and optional cloud providers
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri                          # WebKit rendering, VRM viewer, Vulkan engine
  - --talk-name=org.freedesktop.secrets   # API keys in the system keychain
  # File pickers go through the portal, so no --filesystem access is requested.

modules:
  - name: desktop-college-dorms
    buildsystem: simple
    build-commands:
      - install -Dm755 desktop-college-dorms /app/bin/desktop-college-dorms
      - install -Dm755 dorms-engine /app/bin/dorms-engine
      - install -Dm755 dorms-engine-vulkan /app/bin/dorms-engine-vulkan
      - install -Dm644 share/applications/io.github.thestylewithin.DesktopCollegeDorms.desktop /app/share/applications/io.github.thestylewithin.DesktopCollegeDorms.desktop
      - install -Dm644 share/metainfo/io.github.thestylewithin.DesktopCollegeDorms.metainfo.xml /app/share/metainfo/io.github.thestylewithin.DesktopCollegeDorms.metainfo.xml
      - install -Dm644 share/icons/hicolor/256x256/apps/io.github.thestylewithin.DesktopCollegeDorms.png /app/share/icons/hicolor/256x256/apps/io.github.thestylewithin.DesktopCollegeDorms.png
      - install -Dm644 share/icons/hicolor/512x512/apps/io.github.thestylewithin.DesktopCollegeDorms.png /app/share/icons/hicolor/512x512/apps/io.github.thestylewithin.DesktopCollegeDorms.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.thestylewithin.DesktopCollegeDorms/LICENSE
    sources:
      - type: archive
        url: https://github.com/theStyleWithin/Desktop-college-dorms/releases/download/v0.17.0/desktop-college-dorms-0.17.0-linux-x86_64.tar.gz
        sha256: REPLACE_WITH_SHA256_OF_THE_TARBALL
        strip-components: 1
