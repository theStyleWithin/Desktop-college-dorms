[package]
name = "dorms-core"
version = "0.5.1"
edition = "2021"
description = "Character card parsing/export and prompt assembly for Desktop College Dorms"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
regex = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
