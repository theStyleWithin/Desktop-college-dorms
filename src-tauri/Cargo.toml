[package]
name = "desktop-college-dorms"
version = "0.5.1"
description = "Offline-first AI character creator and chat rooms"
authors = ["theStyleWithin"]
license = "MIT"
edition = "2021"

[lib]
name = "dorms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
dorms-core = { path = "../crates/dorms-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "process", "fs", "io-util", "macros", "net"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = []
# Store all data next to the executable (Windows portable build).
portable = []
# Compile the llama.cpp server into the executable (single-file portable build).
# Needs DORMS_LLAMA_EMBED=<path to llama-server binary> at build time.
embed-llama = []
# Also embed the Vulkan (GPU) build. Needs DORMS_LLAMA_EMBED_VULKAN=<path>.
embed-llama-vulkan = ["embed-llama"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
# the same webkit2gtk that wry uses: lets us allow microphone capture for voice input (and nothing else)
webkit2gtk = "2"
